services:
  # Service web
  - type: web
    name: aolink-app
    env: node
    region: frankfurt  # ou oregon, singapore selon votre localisation
    plan: free  # ou starter pour production
    buildCommand: cd server && npm install
    startCommand: cd server && node src/app/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true  # Render génère automatiquement
      - key: DATABASE_URL
        fromDatabase:
          name: aolink-db
          property: connectionString
      - key: APP_URL
        sync: false  # URL de votre app Render (ex: https://aolink-app.onrender.com)
      - key: EMAIL_USER
        sync: false  # alban.michaud65@gmail.com
      - key: EMAIL_PASS
        sync: false  # App password Gmail
      - key: ALLOWED_ORIGINS
        sync: false  # À configurer manuellement si besoin
      - key: REDIS_URL
        fromService:
          name: aolink-redis
          type: redis
          property: connectionString

databases:
  # Base de données PostgreSQL
  - name: aolink-db
    databaseName: aolink_db
    plan: free  # ou starter pour production
    region: frankfurt  # Même région que le service web
    ipAllowList: []  # Vide = accessible depuis votre service web uniquement

  # Redis (cache, sessions, rate-limiting)
  - type: redis
    name: aolink-redis
    plan: free  # ou starter pour production
    region: frankfurt
    ipAllowList: []
