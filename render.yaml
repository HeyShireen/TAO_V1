services:
  # Service web
  - type: web
    name: tao-app
    env: node
    region: frankfurt  # ou oregon, singapore selon votre localisation
    plan: free  # ou starter pour production
    buildCommand: cd server && npm install
    startCommand: cd server && npm run dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true  # Render génère automatiquement
      - key: DATABASE_URL
        fromDatabase:
          name: tao-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false  # À configurer manuellement

databases:
  # Base de données PostgreSQL
  - name: tao-db
    databaseName: tao_db
    plan: free  # ou starter pour production
    region: frankfurt  # Même région que le service web
    ipAllowList: []  # Vide = accessible depuis votre service web uniquement
