<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TAO — Comparateur d'offres</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <!-- Spinner global -->
  <div id="global-loader" class="loader-overlay hidden">
    <div class="loader-spinner"></div>
  </div>

  <div id="app">

    <!-- ===== LOGIN ===== -->
    <section id="login-view" class="card max-480">
      <h1>Connexion</h1>
      <p class="muted">Crée l'admin à la première utilisation.</p>
      <label class="field"><span>Email</span><input id="email" type="email" placeholder="vous@exemple.fr"/></label>
      <label class="field"><span>Mot de passe</span><input id="password" type="password" placeholder="••••••••"/></label>
      <div class="row gap">
        <button id="login-btn" class="btn">Se connecter</button>
        <button id="dev-bypass" class="btn warning">🚧 Dev Bypass</button>
        <button id="bootstrap-admin" class="btn ghost">Créer admin</button>
        <button id="reset-admin" class="btn warning">Réinitialiser mot de passe admin</button>
      </div>
      <p id="login-msg" class="muted"></p>
    </section>

    <!-- ===== APP ===== -->
    <section id="dashboard" class="hidden">
      <header class="header">
        <h1>TAO</h1>
        <div class="tabs">
          <button data-tab="tab-projects" class="tab active">Projets</button>
          <button data-tab="tab-project"  class="tab" disabled>Projet</button>
          <button data-tab="tab-lot"      class="tab" disabled>Lot</button>
        </div>
        <div class="spacer"></div>
        <button id="logout" class="btn ghost">Déconnexion</button>
      </header>

      <!-- Onglet Projets -->
      <section id="tab-projects" class="tabpanel">
        <div class="card">
          <h2>Nouveau projet</h2>
          <div class="grid grid-4 gap">
            <input id="proj-name" placeholder="Nom du projet *" />
            <input id="proj-ref" placeholder="Référence" />
            <input id="proj-client" placeholder="Client" />
            <input id="proj-location" placeholder="Localisation" />
          </div>
          <div class="row"><button id="create-project" class="btn">Créer</button></div>
        </div>

        <div class="card">
          <h2>Liste des projets</h2>
          <div class="table-wrapper">
            <table id="projects-table">
              <thead><tr><th>ID</th><th>Nom</th><th>Réf</th><th>Client</th><th>Créé</th><th></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Onglet Projet -->
      <section id="tab-project" class="tabpanel hidden">
        <div class="card">
          <h2 id="project-title">Projet</h2>
          <div class="grid grid-3 gap">
            <input id="lot-code" placeholder="Code lot (ex: GO)"/>
            <input id="lot-name" placeholder="Nom du lot (ex: Gros Œuvre) *"/>
            <button id="add-lot" class="btn">Ajouter le lot</button>
          </div>
          <div class="table-wrapper">
            <table id="lots-table">
              <thead><tr><th>ID</th><th>Code</th><th>Nom</th><th></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Onglet Lot -->
      <section id="tab-lot" class="tabpanel hidden">
        <div class="card">
          <div class="lot-header">
            <h2 id="lot-title">Lot</h2>
            <div class="row gap">
              <button id="mode-compare" class="btn ghost active-mode">Comparatif</button>
              <button id="mode-edit" class="btn">Édition (tableur)</button>
            </div>
          </div>

          <!-- Actions tableur -->
          <div id="sheet-actions" class="row gap hidden">
            <button id="add-row" class="btn">+ Ligne</button>
            <input id="company-input" placeholder="Nom d’une entreprise"/>
            <button id="add-company" class="btn ghost">+ Entreprise</button>
            <div id="lot-companies" class="chips"></div>
            <div class="spacer"></div>
            <button id="undo" class="btn ghost">↶</button>
            <button id="redo" class="btn ghost">↷</button>
            <button id="save-grid" class="btn">Sauvegarder</button>
          </div>

          <!-- VUE TABLEUR -->
          <div id="sheet-view" class="table-wrapper tall hidden">
            <table id="sheet-table">
              <thead id="sheet-head"></thead>
              <tbody id="sheet-body"></tbody>
            </table>
          </div>

          <!-- VUE COMPARATIF -->
          <div id="compare-view" class="table-wrapper tall">
            <table id="compare-table">
              <thead id="compare-head"></thead>
              <tbody id="compare-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </section>

  </div>

  <script src="./app.js"></script>
</body>
</html>
