<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — TAO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css"/>
  <link rel="icon" type="image/x-icon" href="./assets/favicon_io/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon_io/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon_io/apple-touch-icon.png" />
  <link rel="manifest" href="./assets/favicon_io/site.webmanifest" />
  <meta name="theme-color" content="#0a0e14" />
</head>
<body>
  <div class="max-480 card">
    <div class="login-logo-container">
      <img id="login-logo" src="./assets/logo.png" alt="Logo" class="login-logo" />
    </div>
    <h1>TAO — Connexion</h1>
    <p class="muted">Accédez à votre espace de travail ou créez un compte</p>

    <div class="row gap" style="margin: 12px 0 20px 0;">
      <button id="tab-login" class="btn" type="button">Connexion</button>
      <button id="tab-register" class="btn ghost" type="button">Créer un compte</button>
    </div>

    <form class="auth-form" id="login-form">
      <label class="field"><span>Email</span><input id="login-email" name="email" type="email" placeholder="vous@exemple.fr" autocomplete="email" required/></label>
      <label class="field"><span>Mot de passe</span><input id="login-password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required/></label>
      <div class="row gap">
        <button id="login-btn" type="submit" class="btn">Se connecter</button>
        <a href="/" class="btn ghost">Retour</a>
      </div>
      <p id="login-msg" class="muted"></p>
      <p class="muted forgot-pwd-text">
        <a href="#" id="forgot-password-link" class="link-primary">Mot de passe oublié ?</a>
      </p>
    </form>

    <form class="auth-form hidden" id="register-form">
      <label class="field"><span>Email</span><input id="register-email" name="email" type="email" placeholder="vous@exemple.fr" autocomplete="email" required/></label>
      <label class="field"><span>Mot de passe</span><input id="register-password" name="password" type="password" placeholder="••••••••" autocomplete="new-password" required/></label>
      <label class="field"><span>Confirmer</span><input id="register-password-confirm" name="password_confirm" type="password" placeholder="••••••••" autocomplete="new-password" required/></label>
      <div class="row gap">
        <button id="register-btn" type="submit" class="btn">Créer mon compte</button>
        <button type="button" class="btn ghost" id="back-to-login">J'ai déjà un compte</button>
      </div>
      <p class="muted" style="margin-top:8px">Un email de confirmation sera envoyé pour activer votre compte.</p>
    </form>
  </div>

  <script src="./login.js" defer></script>
</body>
</html>
